<!DOCTYPE html>
{% extends 'base.html' %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
{% block content %}
    <h1>Sign Up</h1>
    <form name="signup" method="post" action="/signup">
        {{ form.csrf_token }}
        <div>{{ form.name.label }}: {{ form.name() }}</div>
        <div>{{ form.username.label }}: {{ form.username() }}</div>
        <div>{{ form.password.label }}: {{ form.password() }}</div>
        <div>{{ form.submit() }}</div>
    </form>
{% endblock content %}
</body>
</html>
